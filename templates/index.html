<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柱状图生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin: 20px 0;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 300;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }
        
        .form-section-title {
            font-weight: 600;
            color: #495057;
            margin-bottom: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-section-title .badge {
            background: #667eea;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group:last-child {
            margin-bottom: 0;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        
        label .optional {
            color: #999;
            font-weight: 400;
            font-size: 12px;
        }
        
        select, input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
        }
        
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: auto;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
        }
        
        .color-picker-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .color-picker-group input[type="color"] {
            width: 50px;
            height: 40px;
            padding: 2px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .color-picker-group .color-label {
            font-size: 13px;
            color: #666;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4);
        }
        
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        
        .btn-warning:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
        }
        
        .btn-outline {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-outline:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .chart-container {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        
        .chart-container.active {
            display: block;
        }
        
        #chartImage {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 2px solid #f0f0f0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #ef4444;
            margin-top: 10px;
            padding: 12px;
            background: #fee;
            border-radius: 8px;
            display: none;
            border-left: 4px solid #ef4444;
        }
        
        .success {
            color: #10b981;
            margin-top: 10px;
            padding: 12px;
            background: #d1fae5;
            border-radius: 8px;
            display: none;
            border-left: 4px solid #10b981;
        }
        
        .download-options {
            display: none;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .download-options.active {
            display: flex;
        }
        
        .format-select {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .hint-text {
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
        }
        
        .hint-text.active {
            display: none;
        }
        
        .advanced-toggle {
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .advanced-toggle:hover {
            color: #5a6fd6;
        }
        
        .advanced-content {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #dee2e6;
        }
        
        .advanced-content.active {
            display: block;
        }
        
        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        @media (max-width: 768px) {
            .row, .row-3 {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 柱状图生成器</h1>
        <p class="subtitle">精细控制你的柱状图每一个细节</p>
        
        <!-- 基础设置 -->
        <div class="form-section">
            <div class="form-section-title">
                📝 基础设置
                <span class="badge">必填</span>
            </div>
            
            <div class="form-group">
                <label for="chartTitle">图表标题</label>
                <input type="text" id="chartTitle" value="柱状图示例" placeholder="输入图表标题">
            </div>
            
            <div class="form-group">
                <label for="chartData">数据（用逗号分隔）</label>
                <input type="text" id="chartData" value="10,20,15,30,25,35" placeholder="例如: 10,20,15,30,25">
                <div class="help-text">输入数字，用英文逗号分隔</div>
            </div>
            
            <div class="row">
                <div class="form-group">
                    <label for="xLabel">X轴标签 <span class="optional">(选填)</span></label>
                    <input type="text" id="xLabel" placeholder="例如: 类别" value="项目">
                </div>
                <div class="form-group">
                    <label for="yLabel">Y轴标签 <span class="optional">(选填)</span></label>
                    <input type="text" id="yLabel" placeholder="例如: 数值" value="数量">
                </div>
            </div>
            
            <div class="form-group">
                <label for="xTicks">X轴刻度标签 <span class="optional">(选填，用逗号分隔)</span></label>
                <input type="text" id="xTicks" placeholder="例如: A,B,C,D,E,F" value="A,B,C,D,E,F">
                <div class="help-text">自定义X轴显示的文字，数量应与数据数量一致</div>
            </div>
        </div>
        
        <!-- 高级选项 -->
        <div class="form-section">
            <div class="form-section-title">
                ⚙️ 高级选项
                <span class="badge" style="background: #f59e0b;">选填</span>
                <span class="advanced-toggle" id="advancedToggle">▼ 展开</span>
            </div>
            
            <div class="advanced-content" id="advancedContent">
                <div class="row-3">
                    <div class="form-group">
                        <label>柱状图颜色</label>
                        <div class="color-picker-group">
                            <input type="color" id="barColor" value="#667eea">
                            <span class="color-label">主色</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>边框颜色</label>
                        <div class="color-picker-group">
                            <input type="color" id="edgeColor" value="#5a6fd6">
                            <span class="color-label">边框色</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>背景颜色</label>
                        <div class="color-picker-group">
                            <input type="color" id="bgColor" value="#ffffff">
                            <span class="color-label">背景色</span>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label for="barWidth">柱状图宽度 <span class="optional">(0.1-1.0)</span></label>
                        <input type="number" id="barWidth" value="0.6" min="0.1" max="1.0" step="0.05">
                        <div class="help-text">数值越大柱子越宽</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="fontSize">字体大小 <span class="optional">(8-20)</span></label>
                        <input type="number" id="fontSize" value="12" min="8" max="20" step="1">
                    </div>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label for="titleFontSize">标题字体大小 <span class="optional">(10-30)</span></label>
                        <input type="number" id="titleFontSize" value="16" min="10" max="30" step="1">
                    </div>
                    
                    <div class="form-group">
                        <label for="figSize">图片尺寸 <span class="optional">(英寸)</span></label>
                        <div class="row" style="gap: 10px;">
                            <input type="number" id="figWidth" value="10" min="4" max="20" step="0.5" placeholder="宽">
                            <input type="number" id="figHeight" value="6" min="3" max="15" step="0.5" placeholder="高">
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="showGrid" checked>
                            <label for="showGrid">显示网格线</label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="showValues" checked>
                            <label for="showValues">显示数值标签</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="customColors">自定义颜色列表 <span class="optional">(选填，用逗号分隔十六进制颜色)</span></label>
                    <input type="text" id="customColors" placeholder="例如: #FF6B6B,#4ECDC4,#45B7D1,#FFA07A,#98D8C8">
                    <div class="help-text">为每个柱子单独设置颜色，数量应与数据数量一致</div>
                </div>
            </div>
        </div>
        
        <!-- 按钮组 -->
        <div class="button-group">
            <button class="btn btn-primary" id="generateBtn">🚀 生成柱状图</button>
            <button class="btn btn-success" id="downloadBtn" disabled>💾 下载图表</button>
        </div>
        
        <div class="download-options" id="downloadOptions">
            <select class="format-select" id="formatSelect">
                <option value="png">PNG</option>
                <option value="jpg">JPG</option>
                <option value="pdf">PDF</option>
            </select>
            <input type="text" class="format-select" id="filenameInput" placeholder="文件名" value="bar_chart">
            <button class="btn btn-warning" id="downloadWithOptionsBtn" disabled>⬇️ 下载</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">正在生成柱状图...</p>
        </div>
        
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        
        <div class="chart-container" id="chartContainer">
            <img id="chartImage" alt="生成的柱状图">
        </div>
        
        <div class="hint-text" id="hintText">
            💡 提示：填写基础信息后点击"生成柱状图"，高级选项可定制更多细节
        </div>
    </div>

    <script>
        // 状态变量
        let currentChartBase64 = null;
        let currentConfig = null;
        let isGenerating = false;
        
        // DOM元素
        const chartTitle = document.getElementById('chartTitle');
        const chartData = document.getElementById('chartData');
        const xLabel = document.getElementById('xLabel');
        const yLabel = document.getElementById('yLabel');
        const xTicks = document.getElementById('xTicks');
        const barColor = document.getElementById('barColor');
        const edgeColor = document.getElementById('edgeColor');
        const bgColor = document.getElementById('bgColor');
        const barWidth = document.getElementById('barWidth');
        const fontSize = document.getElementById('fontSize');
        const titleFontSize = document.getElementById('titleFontSize');
        const figWidth = document.getElementById('figWidth');
        const figHeight = document.getElementById('figHeight');
        const showGrid = document.getElementById('showGrid');
        const showValues = document.getElementById('showValues');
        const customColors = document.getElementById('customColors');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadOptions = document.getElementById('downloadOptions');
        const formatSelect = document.getElementById('formatSelect');
        const filenameInput = document.getElementById('filenameInput');
        const downloadWithOptionsBtn = document.getElementById('downloadWithOptionsBtn');
        const loading = document.getElementById('loading');
        const chartContainer = document.getElementById('chartContainer');
        const chartImage = document.getElementById('chartImage');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const hintText = document.getElementById('hintText');
        const advancedToggle = document.getElementById('advancedToggle');
        const advancedContent = document.getElementById('advancedContent');
        
        // 高级选项展开/折叠
        let advancedOpen = false;
        advancedToggle.addEventListener('click', () => {
            advancedOpen = !advancedOpen;
            advancedContent.classList.toggle('active', advancedOpen);
            advancedToggle.textContent = advancedOpen ? '▲ 收起' : '▼ 展开';
        });
        
        // 生成柱状图
        generateBtn.addEventListener('click', async () => {
            if (isGenerating) return;
            
            // 收集数据
            const dataStr = chartData.value.trim();
            const data = dataStr.split(',').map(s => parseFloat(s.trim())).filter(v => !isNaN(v));
            
            if (data.length === 0) {
                showError('请输入有效的数字数据，用逗号分隔');
                return;
            }
            
            // 收集X轴刻度标签
            let xTicksList = null;
            if (xTicks.value.trim()) {
                xTicksList = xTicks.value.split(',').map(s => s.trim()).filter(s => s);
                if (xTicksList.length !== data.length) {
                    showError(`X轴标签数量(${xTicksList.length})与数据数量(${data.length})不一致`);
                    return;
                }
            }
            
            // 收集自定义颜色
            let customColorsList = null;
            if (customColors.value.trim()) {
                customColorsList = customColors.value.split(',').map(s => s.trim()).filter(s => s);
                if (customColorsList.length !== data.length) {
                    showError(`自定义颜色数量(${customColorsList.length})与数据数量(${data.length})不一致`);
                    return;
                }
            }
            
            // 构建配置
            const config = {
                type: 'bar',
                title: chartTitle.value.trim() || '柱状图',
                data: data,
                x_label: xLabel.value.trim() || null,
                y_label: yLabel.value.trim() || null,
                x_ticks: xTicksList,
                bar_color: barColor.value,
                edge_color: edgeColor.value,
                background_color: bgColor.value,
                bar_width: parseFloat(barWidth.value) || 0.6,
                font_size: parseInt(fontSize.value) || 12,
                title_font_size: parseInt(titleFontSize.value) || 16,
                fig_width: parseFloat(figWidth.value) || 10,
                fig_height: parseFloat(figHeight.value) || 6,
                show_grid: showGrid.checked,
                show_values: showValues.checked,
                custom_colors: customColorsList
            };
            
            currentConfig = config;
            
            // 显示加载状态
            isGenerating = true;
            generateBtn.disabled = true;
            loading.classList.add('active');
            chartContainer.classList.remove('active');
            downloadBtn.disabled = true;
            downloadOptions.classList.remove('active');
            downloadWithOptionsBtn.disabled = true;
            hintText.classList.add('active');
            hideMessages();
            
            try {
                const response = await fetch('/api/chart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(config)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentChartBase64 = result.image;
                    chartImage.src = result.image;
                    chartContainer.classList.add('active');
                    downloadBtn.disabled = false;
                    downloadOptions.classList.add('active');
                    downloadWithOptionsBtn.disabled = false;
                    hintText.classList.remove('active');
                    showSuccess('✅ 柱状图生成成功！');
                } else {
                    showError('生成失败: ' + result.error);
                    hintText.classList.remove('active');
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
                hintText.classList.remove('active');
            } finally {
                loading.classList.remove('active');
                generateBtn.disabled = false;
                isGenerating = false;
            }
        });
        
        // 下载图表
        downloadWithOptionsBtn.addEventListener('click', async () => {
            if (!currentChartBase64 || !currentConfig) {
                showError('请先生成柱状图');
                return;
            }
            
            const format = formatSelect.value;
            const filename = filenameInput.value.trim() || 'bar_chart';
            
            downloadWithOptionsBtn.disabled = true;
            downloadWithOptionsBtn.textContent = '下载中...';
            
            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ...currentConfig,
                        format: format,
                        filename: filename
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '下载失败');
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${filename}.${format}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                showSuccess('✅ 下载成功！');
                setTimeout(() => hideMessages(), 3000);
                
            } catch (error) {
                showError('下载失败: ' + error.message);
            } finally {
                downloadWithOptionsBtn.disabled = false;
                downloadWithOptionsBtn.textContent = '⬇️ 下载';
            }
        });
        
        // 快捷下载
        downloadBtn.addEventListener('click', () => {
            formatSelect.value = 'png';
            downloadWithOptionsBtn.click();
        });
        
        // 辅助函数
        function showError(msg) {
            errorMsg.textContent = '❌ ' + msg;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
        }
        
        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
        }
        
        function hideMessages() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }
        
        // 回车键生成
        chartData.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateBtn.click();
            }
        });
        
        // 初始状态 - 不自动生成
        console.log('柱状图生成器已加载，请配置参数后点击生成');
    </script>
</body>
</html>
